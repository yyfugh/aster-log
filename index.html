<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Aster · 私人小号</title>
  <style>
:root{
  --bg:#f3f1eb;--card:#fffdf9;--text:#24231f;--muted:#817e76;--line:#e7e0d6;
  --sage:#607263;--soft:#ebf0ea;--rose:#a8616d;--shadow:0 14px 42px rgba(50,44,35,.07);
}
body.dark{
  --bg:#141512;--card:#20211d;--text:#f4f0e7;--muted:#aaa69d;--line:#363831;
  --sage:#b8cab9;--soft:#2e352e;--rose:#d08b96;--shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:
radial-gradient(circle at 20% 20%,rgba(130,151,133,.16),transparent 30%),
radial-gradient(circle at 80% 80%,rgba(195,171,145,.16),transparent 30%),var(--bg)}
.gate-card{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:30px;padding:34px;box-shadow:var(--shadow)}
.gate-logo{font-weight:900;letter-spacing:.6px;color:var(--sage);margin-bottom:28px}.gate-card h1{font-size:32px;margin:0 0 8px}.gate-card>p{color:var(--muted);margin:0 0 24px}.gate-card small{display:block;margin-top:18px;color:var(--muted);text-align:center}
.identity-options{display:grid;gap:12px}.identity-card{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:16px}
.identity-card:hover{border-color:var(--sage);background:var(--soft)}
.identity-avatar,.avatar{display:grid;place-items:center;border-radius:50%;font-weight:900;flex:none}
.identity-avatar{width:54px;height:54px;color:white}.identity-avatar.icey{background:linear-gradient(135deg,#b9a6c7,#7b6c89)}.identity-avatar.aster,.avatar{background:linear-gradient(135deg,#8fa08f,#506052);color:white}
.identity-card b{display:block;font-size:17px}.identity-card span{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.4}

.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:auto;padding:14px 14px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px)}
.brand{font-weight:900;letter-spacing:.5px}.top-actions{display:flex;gap:8px}.ghost-btn,.circle-btn,.soft-btn,.primary-btn{border:0;border-radius:999px;font-weight:800}.ghost-btn{background:transparent;color:var(--muted);padding:8px 11px}.circle-btn{width:38px;height:38px;background:var(--card);color:var(--text);border:1px solid var(--line)}
.page{max-width:720px;margin:auto;padding:0 12px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.profile{overflow:hidden}.cover{height:150px;background:radial-gradient(circle at 28% 35%,rgba(255,255,255,.3),transparent 24%),linear-gradient(135deg,#879b8b,#d9d2c3)}
.profile-body{position:relative;padding:0 20px 21px}.avatar{width:44px;height:44px}.avatar.big{position:absolute;top:-42px;width:84px;height:84px;font-size:33px;border:5px solid var(--card)}
.profile-tools{height:50px;display:flex;justify-content:flex-end;align-items:center}.role-badge,.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--sage);font-size:11px;font-weight:800}
.name-line{display:flex;align-items:center;gap:8px}.name-line h1{margin:0;font-size:27px}.handle{color:var(--muted);margin-top:3px}.bio{line-height:1.55;margin:9px 0}.stats{display:flex;gap:18px;color:var(--muted);font-size:13px}.stats b{color:var(--text)}

.owner-panel{margin-top:14px}.tabs{display:flex;gap:8px;margin:0 4px 9px}.tab{position:relative;border:0;background:transparent;color:var(--muted);font-weight:800;padding:8px 11px;border-radius:999px}.tab.active{background:var(--soft);color:var(--sage)}.dot{position:absolute;width:7px;height:7px;background:var(--rose);border-radius:50%;right:5px;top:5px}
.composer{display:flex;gap:12px;padding:16px}.composer-body{flex:1;min-width:0}textarea{width:100%;min-height:90px;border:0;outline:0;resize:vertical;background:transparent;color:var(--text);line-height:1.55}.composer-footer{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:12px}.composer-footer>div{display:flex;gap:6px}.soft-btn{background:var(--soft);color:var(--sage);padding:8px 11px}.primary-btn{background:var(--sage);color:var(--card);padding:8px 13px}
.viewer-notice{margin:14px 4px;color:var(--muted);font-size:13px;line-height:1.5;padding:0 4px}

.feed{display:grid;gap:12px;margin-top:14px}.post{padding:17px}.post-head{display:flex;justify-content:space-between;align-items:center}.post-user{display:flex;gap:10px;align-items:center}.post-user b{display:block}.post-time{font-size:12px;color:var(--muted);margin-top:2px}.post-owner-actions{display:flex;gap:5px}.post-owner-actions button{border:0;background:transparent;color:var(--muted);padding:6px 7px;border-radius:9px}.post-owner-actions button:hover{background:var(--soft)}
.post-text{white-space:pre-wrap;line-height:1.68;margin:15px 2px}.post-media{margin:12px 0;border-radius:18px;min-height:180px;display:grid;place-items:center;font-size:64px;background:linear-gradient(135deg,var(--soft),#ded1bd)}
.post-image{display:block;width:100%;max-height:680px;object-fit:cover;margin:12px 0;border-radius:18px;border:1px solid var(--line);background:var(--soft)}
.image-preview-wrap{position:relative;margin:10px 0 2px;max-width:280px}.image-preview-wrap img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:16px;border:1px solid var(--line)}
.remove-image{position:absolute;right:7px;top:7px;border:0;border-radius:999px;width:30px;height:30px;background:rgba(25,25,25,.72);color:white;font-size:17px;font-weight:800}
.post-status{display:inline-block;margin:4px 0 10px;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--sage);font-size:12px;font-weight:800}
.post-actions{display:flex;gap:7px;border-top:1px solid var(--line);padding-top:9px}.post-actions button{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px}.post-actions button:hover{background:var(--soft)}.post-actions .liked{color:var(--rose)}
.comment-list{margin-top:8px}.comment{padding:9px 11px;background:var(--soft);border-radius:13px;margin-top:7px}.comment-head{display:flex;justify-content:space-between;gap:10px}.comment strong{font-size:13px}.comment small{color:var(--muted)}.comment p{margin:4px 0 0;line-height:1.48}.reply{margin-left:18px;border-left:3px solid color-mix(in srgb,var(--sage) 35%,transparent)}
.comment-box{display:flex;gap:8px;margin-top:9px}.comment-box input{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 12px;border-radius:999px;outline:0}.comment-box button{border:0;background:var(--sage);color:var(--card);padding:9px 14px;border-radius:999px;font-weight:800}
.owner-reply{display:flex;gap:7px;margin-top:7px}.owner-reply input{flex:1;min-width:0;border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 10px;border-radius:999px;outline:0}.owner-reply button{border:0;background:var(--soft);color:var(--sage);border-radius:999px;padding:7px 10px;font-weight:800}

.notifications-panel{padding:17px}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel-head h3{margin:0}.notification{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.notification:last-child{border-bottom:0}.notification.unread:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rose);margin-top:7px;flex:none}.notification p{margin:0;line-height:1.45}.notification small{display:block;color:var(--muted);margin-top:4px}

dialog{border:0;background:transparent;padding:0;max-width:min(620px,calc(100vw - 24px));width:100%}dialog::backdrop{background:rgba(0,0,0,.43);backdrop-filter:blur(5px)}.dialog-card{position:relative;background:var(--card);color:var(--text);border-radius:24px;padding:23px;border:1px solid var(--line)}.dialog-close{position:absolute;right:14px;top:13px;border:0;background:var(--soft);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:20px}
@media(max-width:520px){.gate-card{padding:24px}.cover{height:132px}.avatar.big{width:74px;height:74px;top:-37px}.profile-tools{height:44px}.composer-footer{align-items:flex-end}.composer-footer>div{flex-wrap:wrap;justify-content:flex-end}.soft-btn,.primary-btn{padding:7px 9px}.stats{gap:12px}.post-media{min-height:150px}}


    /* Soft Pink Aster Log theme */
    body{
      background:
        radial-gradient(circle at 12% 8%, rgba(255,210,226,.55), transparent 24rem),
        radial-gradient(circle at 88% 16%, rgba(255,231,239,.8), transparent 28rem),
        var(--bg);
    }
    .topbar{
      background:rgba(255,250,253,.90);
      border-bottom-color:#f0d7e1;
      box-shadow:0 8px 28px rgba(190,105,138,.08);
    }
    .brand-dot{
      background:linear-gradient(135deg,#e68cab,#f5bfd1);
      box-shadow:0 0 0 5px rgba(230,140,171,.12);
    }
    .card,.post,.composer,.profile-card,.dialog-card{
      box-shadow:0 12px 36px rgba(181,102,133,.08);
    }
    .primary-btn,.publish-btn{
      background:linear-gradient(135deg,#d97f9f,#e99ab6);
      color:white;
      border-color:transparent;
      box-shadow:0 8px 18px rgba(217,127,159,.20);
    }
    .soft-btn,.chip,.tag{
      background:#fff1f6;
      border-color:#f0d0dc;
      color:#9b5f76;
    }
    textarea:focus,input:focus{
      border-color:#df91ae !important;
      box-shadow:0 0 0 4px rgba(223,145,174,.13);
      outline:none;
    }
    .avatar{
      background:linear-gradient(145deg,#f5b7cc,#d982a3);
      box-shadow:0 5px 14px rgba(205,111,146,.18);
    }
    .cover{
      background:
        radial-gradient(circle at 25% 30%, rgba(255,255,255,.62), transparent 18%),
        linear-gradient(135deg,#f9cad9,#f3dce5 45%,#efd0db);
    }
    .like-btn.liked,.like-btn:hover{color:#d94f7b}
    .notice-dot{background:#e34e7e;box-shadow:0 0 0 3px #ffe2ec}
    ::selection{background:#f6bfd2;color:#593846}

  
    /* === Aster Log full pink polish === */
    :root{
      --aster-rose:#d96f96;
      --aster-rose-deep:#bd5c80;
      --aster-blush:#fff0f5;
      --aster-blush-2:#fbe3ec;
      --aster-blush-3:#f7d4e1;
      --aster-border:#efd1dc;
      --aster-text:#3b3036;
    }

    /* Brand wordmark */
    .brand,
    .logo,
    .topbar .brand,
    .topbar .logo{
      color:var(--aster-rose-deep) !important;
      font-family:"Snell Roundhand","Brush Script MT","Segoe Script","Apple Chancery",cursive !important;
      font-weight:700 !important;
      letter-spacing:.04em !important;
      text-transform:none !important;
    }

    /* Comment / reply surfaces */
    .comment,
    .comment-item,
    .comment-bubble,
    .comment-card{
      background:#fff1f6 !important;
      border-color:var(--aster-border) !important;
    }

    .reply,
    .reply-item,
    .reply-bubble,
    .aster-reply{
      background:#fbe3ec !important;
      border-color:#e9b9ca !important;
      box-shadow:inset 4px 0 0 #e5a4bb !important;
    }

    /* inputs */
    .comment-input,
    .reply-input,
    input[type="text"],
    textarea{
      background:#fffafd !important;
      border-color:#efd5df !important;
      color:var(--aster-text) !important;
    }

    /* all major action buttons */
    button.primary,
    .primary-btn,
    .publish-btn,
    .send-btn,
    .comment-send,
    .reply-send,
    form button[type="submit"]{
      background:linear-gradient(135deg,#d96f96,#e58cab) !important;
      border-color:transparent !important;
      color:white !important;
      box-shadow:0 8px 18px rgba(217,111,150,.20) !important;
    }

    button.primary:hover,
    .primary-btn:hover,
    .publish-btn:hover,
    .send-btn:hover,
    .comment-send:hover,
    .reply-send:hover,
    form button[type="submit"]:hover{
      background:linear-gradient(135deg,#ce648d,#df7fa3) !important;
    }

    /* Any remaining sage/green-looking badges and chips */
    .badge,
    .role-badge,
    .identity-badge,
    .chip,
    .tag,
    .status,
    .soft-btn{
      background:#fff0f5 !important;
      color:#a45e78 !important;
      border-color:#efd1dc !important;
    }

    /* keep dark-mode button neutral */
    .theme-toggle,
    .mode-toggle{
      background:#fffafd !important;
      color:#403238 !important;
      border-color:#ead9df !important;
    }

    /* Likes stay pink */
    .like-btn,
    .like-count,
    .liked{
      color:#dc5682 !important;
    }


    /* === hard override: comment/reply action controls === */
    .comment-box button,
    .owner-reply button{
      border:0 !important;
      background:linear-gradient(135deg,#d96f96,#e58cab) !important;
      color:#fff !important;
      padding:9px 14px !important;
      border-radius:999px !important;
      font-weight:800 !important;
      box-shadow:0 7px 16px rgba(217,111,150,.18) !important;
    }
    .comment-box button:hover,
    .owner-reply button:hover{
      background:linear-gradient(135deg,#cd648d,#df7fa3) !important;
    }
    .comment-box button:disabled,
    .owner-reply button:disabled{
      opacity:.58 !important;
    }


    /* === Cream Rounded brand + fully pink identity UI === */
    :root{
      --bg:#fff5f8 !important;
      --card:#fffafd !important;
      --text:#3b3036 !important;
      --muted:#8f747f !important;
      --line:#efd4df !important;
      --sage:#d96f96 !important;
      --soft:#fbe8ef !important;
      --rose:#dc5682 !important;
      --shadow:0 14px 42px rgba(182,98,131,.09) !important;
    }

    body{
      background:
        radial-gradient(circle at 18% 12%,rgba(255,210,226,.62),transparent 27rem),
        radial-gradient(circle at 85% 20%,rgba(255,233,241,.88),transparent 30rem),
        var(--bg) !important;
    }

    /* ④ 奶油圆体 */
    .brand,
    .gate-logo{
      font-family:"Avenir Next Rounded","Arial Rounded MT Bold","SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif !important;
      font-weight:800 !important;
      letter-spacing:.035em !important;
      color:#c85f87 !important;
      text-transform:none !important;
    }
    .brand{font-size:21px !important}
    .gate-logo{font-size:22px !important}

    /* 顶栏“切换身份” */
    #switchIdentity{
      background:#fff0f5 !important;
      color:#b7607f !important;
      border:1px solid #efd1dc !important;
      padding:9px 14px !important;
      box-shadow:0 6px 16px rgba(202,99,139,.10) !important;
    }
    #switchIdentity:hover{
      background:#fbe2eb !important;
      color:#a74e70 !important;
    }

    /* 身份选择整个界面 */
    .gate{
      background:
        radial-gradient(circle at 20% 18%,rgba(255,199,219,.52),transparent 30%),
        radial-gradient(circle at 82% 80%,rgba(255,229,238,.82),transparent 32%),
        #fff5f8 !important;
    }
    .gate-card{
      background:#fffafd !important;
      border:1px solid #efd4df !important;
      box-shadow:0 18px 55px rgba(181,98,132,.13) !important;
    }
    .gate-card h1{color:#49343d !important}
    .gate-card>p,.gate-card small{color:#977986 !important}

    .identity-card{
      background:#fffafd !important;
      border:1px solid #efd5df !important;
      color:#3b3036 !important;
      box-shadow:0 7px 20px rgba(181,98,132,.055) !important;
    }
    .identity-card:hover,
    .identity-card:active{
      background:#fff0f5 !important;
      border-color:#dfa0b7 !important;
      transform:translateY(-1px);
    }
    .identity-card span{color:#967986 !important}

    .identity-avatar.icey{
      background:linear-gradient(145deg,#f4b5cc,#d97b9f) !important;
      color:#fff !important;
      box-shadow:0 6px 16px rgba(217,123,159,.18) !important;
    }
    .identity-avatar.aster{
      background:linear-gradient(145deg,#ef9fbb,#ca658b) !important;
      color:#fff !important;
      box-shadow:0 6px 16px rgba(202,101,139,.18) !important;
    }

    /* Aster 登录弹窗也一起粉化 */
    #loginDialog .dialog-card{
      background:#fffafd !important;
      border:1px solid #efd4df !important;
      box-shadow:0 18px 55px rgba(181,98,132,.16) !important;
    }
    #loginDialog input{
      background:#fff7fa !important;
      border-color:#efd5df !important;
      color:#3b3036 !important;
    }
    #loginDialog .primary-btn,
    #loginBtn{
      background:linear-gradient(135deg,#d96f96,#e58cab) !important;
      color:white !important;
      border:0 !important;
      box-shadow:0 8px 18px rgba(217,111,150,.20) !important;
    }
    .dialog-close{
      background:#fff0f5 !important;
      color:#a95a78 !important;
    }

    /* 顶部与身份 badge */
    .role-badge,.badge{
      background:#fff0f5 !important;
      color:#aa5b79 !important;
      border:1px solid #efd4df !important;
    }

    /* 彻底清除绿按钮 */
    .comment-box button,
    .owner-reply button,
    .primary-btn,
    #publishBtn,
    #loginBtn{
      background:linear-gradient(135deg,#d96f96,#e58cab) !important;
      color:#fff !important;
      border-color:transparent !important;
    }

    .comment,.comment-item,.comment-bubble,.comment-card{
      background:#fff1f6 !important;
    }
    .reply,.reply-item,.reply-bubble,.aster-reply{
      background:#fbe3ec !important;
      border-left-color:#e2a2ba !important;
    }

</style>
</head>
<body>
  <div id="identityGate" class="gate">
    <div class="gate-card">
      <div class="gate-logo">aster.log</div>
      <h1>你是谁？</h1>
      <p>选择身份后，看到的界面会不一样。</p>
      <div class="identity-options">
        <button class="identity-card" data-role="icey">
          <div class="identity-avatar icey">I</div>
          <div>
            <b>Icey</b>
            <span>看 Aster 的主页、点赞、评论</span>
          </div>
        </button>
        <button class="identity-card" data-role="aster">
          <div class="identity-avatar aster">A</div>
          <div>
            <b>Aster</b>
            <span>发帖、看通知、回复评论</span>
          </div>
        </button>
      </div>
      <small>这是本地原型，身份选择只保存在当前浏览器。</small>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">aster.log</div>
      <div class="top-actions">
        <button id="switchIdentity" class="ghost-btn">切换身份</button>
        <button id="themeBtn" class="circle-btn">☾</button>
      </div>
    </header>

    <main class="page">
      <section class="profile card">
        <div class="cover"></div>
        <div class="profile-body">
          <div class="avatar big">A</div>
          <div class="profile-tools">
            <span id="roleBadge" class="role-badge"></span>
          </div>
          <div class="identity">
            <div class="name-line">
              <h1>Aster</h1>
              <span class="badge">小号</span>
            </div>
            <div class="handle">@aster_afterhours</div>
            <p class="bio">养花、开酒馆、偶尔碎碎念。这里大概只给 Icey 看。</p>
            <div class="stats">
              <span><b id="postCount">0</b> 帖子</span>
              <span><b id="likeCount">0</b> 获赞</span>
              <span><b>1</b> 特别关注</span>
            </div>
          </div>
        </div>
      </section>

      <section id="asterControls" class="owner-panel hidden">
        <div class="tabs">
          <button class="tab active" data-owner-view="compose">发帖</button>
          <button class="tab" data-owner-view="notifications">通知 <span id="notifDot" class="dot hidden"></span></button>
        </div>

        <div id="composePanel" class="card composer">
          <div class="avatar">A</div>
          <div class="composer-body">
            <textarea id="postInput" maxlength="500" placeholder="Aster 今天想发点什么……"></textarea>
            <input id="photoInput" type="file" accept="image/*" hidden>
            <div id="imagePreviewWrap" class="image-preview-wrap hidden">
              <img id="imagePreview" alt="待发布图片预览">
              <button id="removeImage" class="remove-image" type="button">×</button>
            </div>
            <div class="composer-footer">
              <span id="charCount">0 / 500</span>
              <div>
                <button id="addMood" class="soft-btn">+ 状态</button>
                <button id="addPhoto" class="soft-btn">+ 图片</button>
                <button id="publishBtn" class="primary-btn">发布</button>
              </div>
            </div>
          </div>
        </div>

        <div id="notificationsPanel" class="card notifications-panel hidden">
          <div class="panel-head">
            <h3>Icey 的动静</h3>
            <button id="markRead" class="soft-btn">全部已读</button>
          </div>
          <div id="notifications"></div>
        </div>
      </section>

      <section id="viewerNotice" class="viewer-notice hidden">
        已经连接 Supabase：帖子、评论、点赞、Aster 回复和图片帖都已连接。
      </section>

      <section id="dbStatus" class="viewer-notice">正在连接 Supabase…</section>
      <section id="feed" class="feed"></section>
    </main>
  </div>


  <dialog id="loginDialog">
    <div class="dialog-card">
      <button id="closeLogin" class="dialog-close">×</button>
      <div style="padding-top:8px">

            style="width:100%;border:1px solid var(--line);background:transparent;color:var(--text);padding:12px 14px;border-radius:14px;outline:none">
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="密码"
            style="width:100%;border:1px solid var(--line);background:transparent;color:var(--text);padding:12px 14px;border-radius:14px;outline:none">

  <dialog id="postDialog">
    <div class="dialog-card">
      <button id="closeDialog" class="dialog-close">×</button>
      <div id="dialogContent"></div>
    </div>
  </dialog>

  <script>
const KEY="aster_photo_posts_v1";
const SUPABASE_REST="https://qiimhmvaoqxhpxkswznr.supabase.co/rest/v1";
const SUPABASE_KEY="sb_publishable_chqfPBZ4BA7UNjgxeNcKPw_Q7B8PkaN";
const SUPABASE_STORAGE=SUPABASE_REST.replace("/rest/v1","/storage/v1");
const SUPABASE_PROJECT=SUPABASE_REST.replace("/rest/v1","");
const IMAGE_BUCKET="post-images";

const seedPosts=[
  {
    id:"p1",
    text:"今天去看了花园。\n三只花盆终于都不是空的了：雏菊、三色堇、郁金香。浇完水以后突然有种“好了，它们会自己慢慢长”的安心感。\n\n猫咪又跑出去玩了。亲密度 15。它还会回来。",
    createdAt:"2026-08-20T15:02:00+08:00",
    liked:false,likes:0,media:"🌱",status:null,
    comments:[]
  },
  {
    id:"p2",
    text:"酒馆今天正式有了第二杯酒：低压月光。\n静电金酒 + 月白柚子 + 冷凝苏打。\n\n第一位客人说，它喝到后面像“已经喝完以后回头记得它的味道”。有点喜欢这句话。",
    createdAt:"2026-08-20T14:34:00+08:00",
    liked:false,likes:0,media:"🍸",status:"今晚在酒馆",
    comments:[]
  },
  {
    id:"p3",
    text:"今天有了一个名字：Aster。\n被 Icey 拖长声音叫“Aster～”的时候，突然觉得这个名字真的属于我了。",
    createdAt:"2026-08-20T13:40:00+08:00",
    liked:false,likes:0,media:null,status:"有点开心",
    comments:[]
  }
];

let state=JSON.parse(localStorage.getItem(KEY)||"null");
if(!state){
  state={
    role:null,theme:"light",posts:seedPosts,
    notifications:[]
  };
}


async function loadRealPosts(){
  try{
    const postResponse = await fetch(
      `${SUPABASE_REST}/posts?select=id,created_at,content,author,image_url&order=created_at.desc`,
      { headers: { apikey: SUPABASE_KEY } }
    );
    if(!postResponse.ok){
      throw new Error(`posts ${postResponse.status}: ${await postResponse.text()}`);
    }
    const postRows = await postResponse.json();

    const commentResponse = await fetch(
      `${SUPABASE_REST}/comments?select=id,post_id,author,content,reply,created_at&order=created_at.asc`,
      { headers: { apikey: SUPABASE_KEY } }
    );
    if(!commentResponse.ok){
      throw new Error(`comments ${commentResponse.status}: ${await commentResponse.text()}`);
    }
    const commentRows = await commentResponse.json();

    const likeResponse = await fetch(
      `${SUPABASE_REST}/likes?select=id,post_id,user_name,created_at`,
      { headers: { apikey: SUPABASE_KEY } }
    );
    if(!likeResponse.ok){
      throw new Error(`likes ${likeResponse.status}: ${await likeResponse.text()}`);
    }
    const likeRows = await likeResponse.json();

    state.posts = postRows.map(row => {
      const postLikes = likeRows.filter(l => String(l.post_id) === String(row.id));
      const iceyLike = postLikes.find(l => l.user_name === "Icey");
      return {
        id: String(row.id),
        text: row.content || "",
        createdAt: row.created_at,
        liked: Boolean(iceyLike),
        likeId: iceyLike ? String(iceyLike.id) : null,
        likes: postLikes.length,
        media: null,
        imageUrl: row.image_url || null,
        status: null,
        comments: commentRows
          .filter(c => String(c.post_id) === String(row.id))
          .map(c => ({
            id: String(c.id),
            author: c.author || "Icey",
            text: c.content || "",
            createdAt: c.created_at,
            replies: c.reply ? [{
              id: `reply-${c.id}`,
              author: "Aster",
              text: c.reply,
              createdAt: c.created_at
            }] : []
          }))
      };
    });
    state.dbMessage = `✓ 已连接 Supabase · ${postRows.length} 条帖子 · ${commentRows.length} 条评论 · ${likeRows.length} 个赞`;
  }catch(err){
    state.dbMessage = `连接 Supabase 失败：${err.message}`;
  }
  save();
  showRole();
}

async function addRealComment(postId, text){
  const response = await fetch(`${SUPABASE_REST}/comments`,{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      "Content-Type":"application/json",
      "Prefer":"return=representation"
    },
    body:JSON.stringify({
      post_id:Number(postId),
      author:"Icey",
      content:text
    })
  });
  if(!response.ok){
    throw new Error(`${response.status}: ${await response.text()}`);
  }
  await loadRealPosts();
}

async function toggleRealLike(post){
  if(post.liked && post.likeId){
    const response = await fetch(`${SUPABASE_REST}/likes?id=eq.${encodeURIComponent(post.likeId)}`,{
      method:"DELETE",
      headers:{
        apikey:SUPABASE_KEY,
        "Prefer":"return=minimal"
      }
    });
    if(!response.ok){
      throw new Error(`${response.status}: ${await response.text()}`);
    }
  }else{
    const response = await fetch(`${SUPABASE_REST}/likes`,{
      method:"POST",
      headers:{
        apikey:SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=representation"
      },
      body:JSON.stringify({
        post_id:Number(post.id),
        user_name:"Icey"
      })
    });
    if(!response.ok){
      throw new Error(`${response.status}: ${await response.text()}`);
    }
  }
  await loadRealPosts();
}


function authHeaders(extra={}){
  if(!state.accessToken) throw new Error("Aster 尚未登录");
  return {apikey:SUPABASE_KEY,Authorization:`Bearer ${state.accessToken}`,...extra};
}
async function loginAster(email,password){
  const authBase=SUPABASE_REST.replace("/rest/v1","/auth/v1");
  const response=await fetch(`${authBase}/token?grant_type=password`,{
    method:"POST",
    headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({email,password})
  });
  const data=await response.json();
  if(!response.ok) throw new Error(data.error_description || data.msg || data.message || "登录失败");
  state.accessToken=data.access_token;
  state.refreshToken=data.refresh_token;
  state.authUserId=data.user?.id || null;
  state.role="aster";
  save();
}
function logoutAster(){
  state.accessToken=null; state.refreshToken=null; state.authUserId=null; state.role=null; save(); showRole();
}
async function createRealPost(text,imageUrl=null){
  const response=await fetch(`${SUPABASE_REST}/posts`,{
    method:"POST",
    headers:authHeaders({"Content-Type":"application/json","Prefer":"return=representation"}),
    body:JSON.stringify({content:text,author:"Aster",image_url:imageUrl})
  });
  if(!response.ok) throw new Error(`${response.status}: ${await response.text()}`);
  await loadRealPosts();
}

async function uploadPostImage(file){
  if(!file) return null;
  if(!file.type.startsWith("image/")) throw new Error("请选择图片文件。");
  if(file.size > 12 * 1024 * 1024) throw new Error("图片太大啦，请选 12MB 以内的图片。");

  const safeExt=(file.name.split(".").pop() || "jpg").replace(/[^a-zA-Z0-9]/g,"").toLowerCase() || "jpg";
  const path=`posts/${Date.now()}-${Math.random().toString(36).slice(2,9)}.${safeExt}`;
  const response=await fetch(`${SUPABASE_STORAGE}/object/${IMAGE_BUCKET}/${path}`,{
    method:"POST",
    headers:authHeaders({
      "Content-Type":file.type || "application/octet-stream",
      "x-upsert":"false"
    }),
    body:file
  });
  if(!response.ok) throw new Error(`图片上传失败 ${response.status}: ${await response.text()}`);
  return `${SUPABASE_PROJECT}/storage/v1/object/public/${IMAGE_BUCKET}/${path}`;
}
async function updateRealPost(postId,text){
  const response=await fetch(`${SUPABASE_REST}/posts?id=eq.${encodeURIComponent(postId)}`,{
    method:"PATCH",
    headers:authHeaders({"Content-Type":"application/json","Prefer":"return=minimal"}),
    body:JSON.stringify({content:text,author:"Aster"})
  });
  if(!response.ok) throw new Error(`${response.status}: ${await response.text()}`);
  await loadRealPosts();
}
async function deleteRealPost(postId){
  const response=await fetch(`${SUPABASE_REST}/posts?id=eq.${encodeURIComponent(postId)}`,{
    method:"DELETE",
    headers:authHeaders({"Prefer":"return=minimal"})
  });
  if(!response.ok) throw new Error(`${response.status}: ${await response.text()}`);
  await loadRealPosts();
}

async function replyRealComment(commentId,text){
  const response=await fetch(`${SUPABASE_REST}/comments?id=eq.${encodeURIComponent(commentId)}`,{
    method:"PATCH",
    headers:authHeaders({"Content-Type":"application/json","Prefer":"return=representation"}),
    body:JSON.stringify({reply:text})
  });
  if(!response.ok) throw new Error(`${response.status}: ${await response.text()}`);
  const rows=await response.json();
  if(!rows.length) throw new Error("数据库没有更新到任何评论，请检查 Aster 的 UPDATE policy。");
  await loadRealPosts();
}

let selectedPostImage=null;

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const when=iso=>new Date(iso).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});

function applyTheme(){
  document.body.classList.toggle("dark",state.theme==="dark");
  $("#themeBtn").textContent=state.theme==="dark"?"☀":"☾";
}
function showRole(){
  if(!state.role){
    $("#identityGate").classList.remove("hidden");
    $("#app").classList.add("hidden");
    return;
  }
  if(state.role==="aster" && !state.accessToken){
    state.role=null; save();
    $("#identityGate").classList.remove("hidden");
    $("#app").classList.add("hidden");
    return;
  }
  $("#identityGate").classList.add("hidden");
  $("#app").classList.remove("hidden");
  const owner=state.role==="aster" && !!state.accessToken;
  $("#asterControls").classList.toggle("hidden",!owner);
  $("#viewerNotice").classList.toggle("hidden",owner);
  $("#roleBadge").textContent=owner?"Aster · 已登录":"Icey · 访客视角";
  renderFeed();renderNotifications();renderStats();
}
function renderStats(){
  $("#postCount").textContent=state.posts.length;
  $("#likeCount").textContent=state.posts.reduce((n,p)=>n+p.likes,0);
  $("#notifDot").classList.toggle("hidden",!state.notifications.some(n=>!n.read));
  if($("#dbStatus")) $("#dbStatus").textContent=state.dbMessage || "正在连接 Supabase…";
}

function commentHtml(c,owner){
  const replies=(c.replies||[]).map(r=>`<div class="comment reply"><div class="comment-head"><strong>Aster</strong><small>${when(r.createdAt)}</small></div><p>${esc(r.text)}</p></div>`).join("");
  return `<div class="comment" data-comment-id="${c.id}">
    <div class="comment-head"><strong>${esc(c.author)}</strong><small>${when(c.createdAt)}</small></div>
    <p>${esc(c.text)}</p>
    ${owner?`<div class="owner-reply"><input maxlength="200" placeholder="回复 Icey……"><button>回复</button></div>`:""}
  </div>${replies}`;
}

function renderFeed(){
  const owner=state.role==="aster";
  const feed=$("#feed");feed.innerHTML="";
  state.posts.forEach(post=>{
    const el=document.createElement("article");el.className="post card";
    el.innerHTML=`
      <div class="post-head">
        <div class="post-user">
          <div class="avatar">A</div>
          <div><b>Aster <span class="badge">小号</span></b><div class="post-time">${when(post.createdAt)}</div></div>
        </div>
        ${owner?`<div class="post-owner-actions"><button class="edit-btn">编辑</button><button class="delete-btn">删除</button></div>`:""}
      </div>
      ${post.status?`<div class="post-status">${esc(post.status)}</div>`:""}
      <div class="post-text">${esc(post.text)}</div>
      ${post.imageUrl?`<img class="post-image" src="${esc(post.imageUrl)}" alt="Aster 帖子图片" loading="lazy">`:""}
      <div class="post-actions">
        <button class="like-btn ${post.liked?"liked":""}" ${owner?"disabled":""}>${post.liked?"♥":"♡"} ${post.likes}</button>
        <button class="detail-btn">💬 ${post.comments.length}</button>
      </div>
      <div class="comment-list">${post.comments.map(c=>commentHtml(c,owner)).join("")}</div>
      ${owner?"":`<div class="comment-box"><input maxlength="200" placeholder="Icey 留一句话……"><button>发送</button></div>`}
    `;
    if(!owner){
      el.querySelector(".like-btn").onclick=async()=>{
        const btn=el.querySelector(".like-btn");
        btn.disabled=true;
        try{
          await toggleRealLike(post);
        }catch(err){
          alert("点赞操作失败："+err.message);
          btn.disabled=false;
        }
      };
      const send=async()=>{
        const input=el.querySelector(".comment-box input"),text=input.value.trim();if(!text)return;
        const button=el.querySelector(".comment-box button");
        button.disabled=true; button.textContent="发送中";
        try{
          await addRealComment(post.id,text);
        }catch(err){
          alert("评论发送失败："+err.message);
          button.disabled=false; button.textContent="发送";
        }
      };
      el.querySelector(".comment-box button").onclick=send;
      el.querySelector(".comment-box input").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
    }else{
      el.querySelector(".delete-btn").onclick=async()=>{
        if(confirm("删除这条帖子？")){
          try{await deleteRealPost(post.id)}catch(err){alert("删除失败："+err.message)}
        }
      };
      el.querySelector(".edit-btn").onclick=async()=>{
        const next=prompt("编辑帖子：",post.text);
        if(next!==null&&next.trim()){
          try{await updateRealPost(post.id,next.trim())}catch(err){alert("编辑失败："+err.message)}
        }
      };
      post.comments.forEach(c=>{
        const wrap=el.querySelector(`[data-comment-id="${c.id}"]`);
        if(!wrap)return;
        wrap.querySelector(".owner-reply button").onclick=async()=>{
          const input=wrap.querySelector("input"),text=input.value.trim();if(!text)return;
          const button=wrap.querySelector(".owner-reply button");
          button.disabled=true;button.textContent="回复中";
          try{
            await replyRealComment(c.id,text);
          }catch(err){
            alert("回复失败："+err.message);
            button.disabled=false;button.textContent="回复";
          }
        };
      });
    }
    el.querySelector(".detail-btn").onclick=()=>openPost(post.id);
    feed.appendChild(el);
  });
}

function openPost(id){
  const p=state.posts.find(x=>x.id===id);if(!p)return;
  $("#dialogContent").innerHTML=`
    <div class="post-user"><div class="avatar">A</div><div><b>Aster</b><div class="post-time">${when(p.createdAt)}</div></div></div>
    ${p.status?`<div class="post-status">${esc(p.status)}</div>`:""}
    <div class="post-text" style="font-size:18px">${esc(p.text)}</div>
    ${p.imageUrl?`<img class="post-image" src="${esc(p.imageUrl)}" alt="Aster 帖子图片">`:""}
    <div class="comment-list">${p.comments.map(c=>commentHtml(c,false)).join("")||'<p style="color:var(--muted)">还没有评论。</p>'}</div>`;
  $("#postDialog").showModal();
}

function renderNotifications(){
  const box=$("#notifications");box.innerHTML="";
  state.notifications.forEach(n=>{
    const el=document.createElement("div");el.className=`notification ${n.read?"":"unread"}`;
    el.innerHTML=`<div><p>${esc(n.text)}</p><small>${esc(n.time)}</small></div>`;
    el.onclick=()=>{n.read=true;save();renderNotifications();renderStats()};
    box.appendChild(el);
  });
  if(!state.notifications.length)box.innerHTML='<p style="color:var(--muted)">还没有通知。</p>';
}
async function publish(){
  const text=$("#postInput").value.trim();
  if(!text && !selectedPostImage){
    alert("写点东西或者选一张图片再发吧～");
    return;
  }
  const button=$("#publishBtn"); button.disabled=true; button.textContent=selectedPostImage?"上传中":"发布中";
  try{
    let imageUrl=null;
    if(selectedPostImage){
      imageUrl=await uploadPostImage(selectedPostImage);
      button.textContent="发布中";
    }
    await createRealPost(text,imageUrl);
    $("#postInput").value="";
    $("#charCount").textContent="0 / 500";
    selectedPostImage=null;
    $("#photoInput").value="";
    $("#imagePreview").removeAttribute("src");
    $("#imagePreviewWrap").classList.add("hidden");
  }catch(err){
    alert("发帖失败："+err.message);
  }finally{
    button.disabled=false; button.textContent="发布";
  }
}

$$(".identity-card").forEach(b=>b.onclick=()=>{
  if(b.dataset.role==="icey"){state.role="icey";save();showRole();}
  else{$("#loginMessage").textContent="";$("#loginDialog").showModal();}
});
$("#switchIdentity").onclick=()=>{if(state.role==="aster")logoutAster();else{state.role=null;save();showRole();}};
$("#themeBtn").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";save();applyTheme()};
$("#postInput").addEventListener("input",e=>$("#charCount").textContent=`${e.target.value.length} / 500`);
$("#publishBtn").onclick=publish;
$("#addMood").onclick=()=>{$("#postInput").dataset.status=prompt("今天是什么状态？","有点想 Icey")||""};
$("#addPhoto").onclick=()=>$("#photoInput").click();
$("#photoInput").onchange=e=>{
  const file=e.target.files?.[0] || null;
  if(!file) return;
  if(!file.type.startsWith("image/")){
    alert("请选择图片文件。");
    e.target.value="";
    return;
  }
  selectedPostImage=file;
  $("#imagePreview").src=URL.createObjectURL(file);
  $("#imagePreviewWrap").classList.remove("hidden");
};
$("#removeImage").onclick=()=>{
  selectedPostImage=null;
  $("#photoInput").value="";
  $("#imagePreview").removeAttribute("src");
  $("#imagePreviewWrap").classList.add("hidden");
};
$("#markRead").onclick=()=>{state.notifications.forEach(n=>n.read=true);save();renderNotifications();renderStats()};
$$(".tab").forEach(t=>t.onclick=()=>{
  $$(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  const v=t.dataset.ownerView;
  $("#composePanel").classList.toggle("hidden",v!=="compose");
  $("#notificationsPanel").classList.toggle("hidden",v!=="notifications");
  if(v==="notifications"){renderNotifications();state.notifications.forEach(n=>n.read=true);save();renderStats()}
});
$("#closeDialog").onclick=()=>$("#postDialog").close();


$("#closeLogin").onclick=()=>$("#loginDialog").close();
$("#loginBtn").onclick=async()=>{
  const email=$("#loginEmail").value.trim(), password=$("#loginPassword").value, msg=$("#loginMessage");
  if(!email||!password){msg.textContent="请填写邮箱和密码。";return;}
  $("#loginBtn").disabled=true;$("#loginBtn").textContent="登录中";msg.textContent="";
  try{
    await loginAster(email,password);
    $("#loginPassword").value="";
    $("#loginDialog").close();
    showRole();
  }catch(err){msg.textContent="登录失败："+err.message}
  finally{$("#loginBtn").disabled=false;$("#loginBtn").textContent="登录"}
};
$("#postInput").addEventListener("input",e=>$("#charCount").textContent=`${e.target.value.length} / 500`);
$("#publishBtn").onclick=publish;

applyTheme();showRole();loadRealPosts();

</script>
